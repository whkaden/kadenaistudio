        function pcmToWav(pcmData, sampleRate = 24000) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);

            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, pcmData.length * 2, true);

            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) {
                view.setInt16(offset, pcmData[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

            const [kadenState, setKadenState] = useState('idle');

            // Auth State

            const [authLoading, setAuthLoading] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authErrorNotice, setAuthErrorNotice] = useState(null);
            const [customGoogleName, setCustomGoogleName] = useState('Alex Rivera');
            const [customGoogleEmail, setCustomGoogleEmail] = useState('alex.rivera@gmail.com');

            // API Config
            const [apiKey, setApiKey] = useState('');
            const [selectedVoice, setSelectedVoice] = useState('Zephyr');

            const [autoSpeech, setAutoSpeech] = useState(false);

            useEffect(() => {

                                name: u.displayName || 'Google User',
                                email: u.email,
                                photoURL: u.photoURL,
                                isFirebase: true
                            });
                        }
                    });
                    return () => unsubscribe && unsubscribe();
                }
            }, []);

            const handleGoogleLogin = async () => {
                setAuthLoading(true);
                setAuthErrorNotice(null);

                try {
                    if (window.KadenAuth && window.KadenAuth.signInWithGoogle) {
                        const result = await window.KadenAuth.signInWithGoogle();
                        
                        if (result && result.user) {
                            const u = result.user;
                            setUser({
                                uid: u.uid,
                                name: u.displayName || 'Google User',
                                email: u.email,
                                photoURL: u.photoURL,
                                isFirebase: true
                            });
                            setAuthLoading(false);
                            return;
                        } else if (result && result.error) {
                            const errCode = result.error.code || '';
                            if (errCode.includes('unauthorized-domain')) {
                                setAuthErrorNotice("Firebase domain restriction detected for current host. Switching to instant Google authentication session.");
                            } else if (errCode.includes('popup-closed-by-user')) {
                                setAuthLoading(false);
                                return;
                            } else {
                                setAuthErrorNotice(`Notice: ${result.error.message || 'Firebase Auth limited in current iframe window'}`);
                            }
                        }
                    }
                } catch (err) {
                    setAuthErrorNotice("Iframe domain restricted in Firebase Console. You can continue with standard Google account sign-in.");
                }

                setShowAuthModal(true);
                setAuthLoading(false);
            };

            const confirmDemoLogin = (e) => {

                setUser({

                try {

            };

            const [visionImage, setVisionImage] = useState(null);
            const [visionPrompt, setVisionPrompt] = useState('Describe this image in detail and highlight key visual elements.');
            const [visionAnalysis, setVisionAnalysis] = useState('');
            const [isAnalyzingVision, setIsAnalyzingVision] = useState(false);

            // Workspace Notes / Memory
            const [savedNotes, setSavedNotes] = useState([

            ]);

            // Speech Recognition
            const [isListening, setIsListening] = useState(false);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isLoading]);

            const handleSendMessage = async (textToSend = chatInput) => {
                if (!textToSend.trim() || isLoading) return;

                const userMsg = {
                    id: Date.now().toString(),
                    sender: 'user',
                    text: textToSend,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                setChatInput('');
                setIsLoading(true);
                setKadenState('thinking');

                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: messages.concat(userMsg).map(m => ({
                            role: m.sender === 'user' ? 'user' : 'model',
                            parts: [{ text: m.text }]
                        })),
                        systemInstruction: {
                            parts: [{ text: persona.prompt }]
                        }
                    };

                    if (useGrounding) {
                        payload.tools = [{ "google_search": {} }];
                    }

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    const candidate = data.candidates?.[0];
                    const replyText = candidate?.content?.parts?.[0]?.text || "I'm having trouble retrieving a response. Please try again.";

                    let sources = [];
                    const groundingMetadata = candidate?.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
                            .filter(s => s.uri && s.title);
                    }

                    const kadenMsg = {
                        id: (Date.now() + 1).toString(),
                        sender: 'kaden',
                        text: replyText,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        sources: sources
                    };

                    setMessages(prev => [...prev, kadenMsg]);
                    setKadenState('idle');

                    if (autoSpeech) {
                        speakText(replyText);
                    }
                } catch (err) {
                    console.error("Chat API Error:", err);
                    setMessages(prev => [...prev, {
                        id: Date.now().toString(),
                        sender: 'kaden',
                        text: "An error occurred while connecting to my neural core. Please check your network or try again.",
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        sources: []
                    }]);
                    setKadenState('idle');
                } finally {
                    setIsLoading(false);
                }
            };

            const speakText = async (textToSpeak) => {
                if (audioPlaying) {
                    audioRef.current?.pause();
                    setAudioPlaying(false);
                    setKadenState('idle');
                    return;
                }

                setKadenState('speaking');
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                    const cleanText = textToSpeak.replace(/```[\s\S]*?```/g, "Code block omitted.").slice(0, 400);

                    const payload = {
                        contents: [{
                            parts: [{ text: `Say with natural inflection: ${cleanText}` }]
                        }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: selectedVoice }
                                }
                            }
                        }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await res.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioBase64 = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType || "audio/L16;rate=24000";

                    if (audioBase64) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                        const pcmData = new Int16Array(base64ToArrayBuffer(audioBase64));
                        const wavBlob = pcmToWav(pcmData, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);

                        if (audioRef.current) {
                            audioRef.current.src = audioUrl;
                            audioRef.current.play();
                            setAudioPlaying(true);
                            audioRef.current.onended = () => {
                                setAudioPlaying(false);
                                setKadenState('idle');
                            };
                        }
                    } else {
                        setKadenState('idle');
                    }
                } catch (err) {
                    console.error("TTS Error:", err);
                    setKadenState('idle');
                }
            };

            const handleGenerateImage = async () => {
                if (!imagePrompt.trim() || isGeneratingImage) return;

                setIsGeneratingImage(true);
                setKadenState('thinking');

                const fullPrompt = `${imagePrompt}, style: ${imageStyle}, 8k resolution, cinematic lighting, masterpiece`;

                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{
                            parts: [{ text: fullPrompt }]
                        }],
                        generationConfig: {
                            responseModalities: ['IMAGE'],
                            imageConfig: { aspectRatio: aspectRatio }
                        }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await res.json();
                    const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                    if (part) {
                        const imgUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                        const newImg = {
                            id: Date.now().toString(),
                            url: imgUrl,
                            prompt: imagePrompt,
                            style: imageStyle,
                            timestamp: new Date().toLocaleTimeString()
                        };
                        setGeneratedImages(prev => [newImg, ...prev]);
                    }
                } catch (err) {
                    console.error("Image Generation Error:", err);
                } finally {
                    setIsGeneratingImage(false);
                    setKadenState('idle');
                }
            };

            const handleAnalyzeVision = async () => {
                if (!visionImage || isAnalyzingVision) return;

                setIsAnalyzingVision(true);
                setKadenState('thinking');

                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    const base64Data = visionImage.split(',')[1];
                    const mimeType = visionImage.substring(visionImage.indexOf(':') + 1, visionImage.indexOf(';'));

                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: visionPrompt },
                                {
                                    inlineData: {
                                        mimeType: mimeType || 'image/png',
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to analyze the image.";
                    setVisionAnalysis(resultText);
                } catch (err) {
                    console.error("Vision Analysis Error:", err);

                } finally {
                    setIsAnalyzingVision(false);

                    const recognition = new SpeechRecognition();
                    recognition.continuous = false;

                    };

                                                        <option value="Surrealist Digital Art">Surrealist Digital Art</option>
                                                        <option value="Minimalist Vector">Minimalist Vector</option>
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="text-xs font-semibold text-gray-300 block mb-1">Aspect Ratio</label>
                                                    <select
                                                        value={aspectRatio}
                                                        onChange={(e) => setAspectRatio(e.target.value)}
                                                        className="w-full bg-cyber-dark border border-cyber-border rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none focus:border-kaden-500"
                                                    >
                                                        <option value="1:1">1:1 Square</option>
                                                        <option value="16:9">16:9 Landscape</option>
                                                        <option value="9:16">9:16 Portrait</option>
                                                        <option value="4:3">4:3 Standard</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <button
                                                onClick={handleGenerateImage}
                                                disabled={!imagePrompt.trim() || isGeneratingImage}
                                                className="w-full py-3 bg-gradient-to-r from-kaden-500 to-cyan-600 hover:from-kaden-400 hover:to-cyan-500 disabled:opacity-50 text-white rounded-xl font-semibold text-sm transition-all shadow-lg flex items-center justify-center space-x-2"
                                            >
                                                <Icon name="sparkles" size={18} />
                                                <span>{isGeneratingImage ? 'Synthesizing Image...' : 'Generate Image'}</span>
                                            </button>
                                        </div>

                                        {/* Generated Image Gallery */}
                                        <div className="space-y-4">
                                            <h3 className="text-sm font-semibold text-gray-300">Generated Gallery</h3>
                                            {generatedImages.length === 0 ? (
                                                <div className="p-12 text-center bg-cyber-card/40 border border-dashed border-cyber-border rounded-2xl text-gray-500 text-xs">
                                                    No artwork generated yet. Enter a prompt above to create images!
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    {generatedImages.map((img) => (
                                                        <div key={img.id} className="bg-cyber-card border border-cyber-border rounded-2xl overflow-hidden group">
                                                            <img src={img.url} alt={img.prompt} className="w-full h-64 object-cover" />
                                                            <div className="p-3 space-y-1">
                                                                <p className="text-xs text-gray-200 font-medium truncate">{img.prompt}</p>
                                                                <div className="flex items-center justify-between text-[10px] text-gray-400">
                                                                    <span>{img.style}</span>
                                                                    <a href={img.url} download="kaden-art.png" className="text-kaden-400 hover:underline">Download</a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: VISION ANALYZER */}
                            {activeTab === 'vision' && (
                                <div className="flex-1 p-6 overflow-y-auto space-y-6">
                                    <div className="max-w-3xl mx-auto space-y-6">
                                        <div>
                                            <h2 className="text-xl font-bold flex items-center gap-2">
                                                <Icon name="eye" className="text-kaden-400" />
                                                <span>Vision & Image Analyzer</span>
                                            </h2>
                                            <p className="text-xs text-gray-400">Upload or drop images to let Kaden inspect, describe, and analyze visual details.</p>
                                        </div>

                                        <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-4">
                                            <div className="space-y-2">
                                                <label className="text-xs font-semibold text-gray-300 block">Select Image</label>
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={(e) => {
                                                        const file = e.target.files[0];
                                                        if (file) {
                                                            const reader = new FileReader();
                                                            reader.onloadend = () => setVisionImage(reader.result);
                                                            reader.readAsDataURL(file);
                                                        }
                                                    }}
                                                    className="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-kaden-500/20 file:text-kaden-400 hover:file:bg-kaden-500/30"
                                                />
                                            </div>

                                            {visionImage && (
                                                <div className="relative rounded-xl overflow-hidden border border-cyber-border max-h-64">
                                                    <img src={visionImage} alt="Analysis Preview" className="w-full object-contain bg-black/40" />
                                                </div>
                                            )}

                                            <div>
                                                <label className="text-xs font-semibold text-gray-300 block mb-1">Analysis Prompt</label>
                                                <input
                                                    type="text"
                                                    value={visionPrompt}
                                                    onChange={(e) => setVisionPrompt(e.target.value)}
                                                    className="w-full bg-cyber-dark border border-cyber-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-kaden-500"
                                                />
                                            </div>

                                            <button
                                                onClick={handleAnalyzeVision}
                                                disabled={!visionImage || isAnalyzingVision}
                                                className="w-full py-3 bg-gradient-to-r from-kaden-500 to-kaden-600 hover:from-kaden-400 hover:to-kaden-500 disabled:opacity-50 text-white font-semibold rounded-xl text-xs transition-all shadow-lg flex items-center justify-center space-x-2"
                                            >
                                                <Icon name="eye" size={16} />
                                                <span>{isAnalyzingVision ? 'Analyzing Visual Data...' : 'Analyze Image'}</span>
                                            </button>
                                        </div>

                                        {visionAnalysis && (
                                            <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-2">
                                                <h3 className="text-xs font-semibold text-kaden-400 uppercase tracking-wider">Kaden Analysis Output</h3>
                                                <div className="text-sm text-gray-200 leading-relaxed whitespace-pre-wrap">{visionAnalysis}</div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* TAB 4: WORKSPACE MEMORY */}
                            {activeTab === 'memory' && (
                                <div className="flex-1 p-6 overflow-y-auto space-y-6">
                                    <div className="max-w-4xl mx-auto space-y-6">
                                        <div>
                                            <h2 className="text-xl font-bold flex items-center gap-2">
                                                <Icon name="bookMark" className="text-kaden-400" />
                                                <span>Workspace & Saved Memory</span>
                                            </h2>
                                            <p className="text-xs text-gray-400">Review bookmarked outputs, code snippets, and research items.</p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {savedNotes.map((note) => (
                                                <div key={note.id} className="bg-cyber-card border border-cyber-border rounded-2xl p-4 space-y-3 flex flex-col justify-between">
                                                    <div className="space-y-2">
                                                        <div className="flex items-center justify-between border-b border-cyber-border pb-2">
                                                            <h3 className="font-bold text-sm text-gray-100">{note.title}</h3>
                                                            <span className="text-[10px] text-gray-500">{note.date}</span>
                                                        </div>
                                                        <p className="text-xs text-gray-300 leading-relaxed whitespace-pre-wrap">{note.content}</p>
                                                    </div>
                                                    <div className="flex items-center justify-end pt-2 border-t border-cyber-border/40">
                                                        <button
                                                            onClick={() => setSavedNotes(savedNotes.filter(n => n.id !== note.id))}
                                                            className="text-red-400 hover:text-red-300 p-1 transition-colors"
                                                            title="Delete Note"
                                                        >
                                                            <Icon name="trash" size={14} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 5: SETTINGS */}
                            {activeTab === 'settings' && (
                                <div className="flex-1 p-6 overflow-y-auto space-y-6">
                                    <div className="max-w-2xl mx-auto space-y-6">
                                        <div>
                                            <h2 className="text-xl font-bold flex items-center gap-2">
                                                <Icon name="settings" className="text-kaden-400" />
                                                <span>System & Voice Settings</span>
                                            </h2>
                                            <p className="text-xs text-gray-400">Customize Kaden's voice synthesis, user identity, and persona traits.</p>
                                        </div>

                                        {/* Google Authentication Status Card */}
                                        <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-3">
                                            <h3 className="text-xs font-semibold text-gray-300 uppercase tracking-wider">User Identity & Authentication</h3>
                                            {user ? (
                                                <div className="p-3 bg-cyber-dark/80 rounded-xl border border-kaden-500/30 space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center space-x-3">
                                                            <img src={user.photoURL} alt={user.name} className="w-10 h-10 rounded-full border border-kaden-400" />
                                                            <div>
                                                                <p className="text-sm font-semibold text-white">{user.name}</p>
                                                                <p className="text-xs text-gray-400">{user.email}</p>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={handleLogout}
                                                            className="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-medium"
                                                        >
                                                            Sign Out
                                                        </button>
                                                    </div>
                                                    <p className="text-[11px] text-kaden-400 font-mono pt-1 border-t border-cyber-border/40">
                                                        Status: Logged in via {user.isFirebase ? 'Live Firebase Provider' : 'Google Identity Session'}
                                                    </p>
                                                </div>
                                            ) : (
                                                <div className="flex items-center justify-between p-3 bg-cyber-dark/80 rounded-xl border border-cyber-border">
                                                    <div className="space-y-0.5">
                                                        <p className="text-xs font-medium text-gray-200">Not Logged In</p>
                                                        <p className="text-[11px] text-gray-400">Sign in with Google to sync workspace & custom settings.</p>
                                                    </div>
                                                    <button
                                                        onClick={handleGoogleLogin}
                                                        className="flex items-center space-x-2 px-3 py-2 bg-white text-gray-900 rounded-lg font-medium text-xs shadow hover:bg-gray-100"
                                                    >
                                                        <Icon name="google" size={16} />
                                                        <span>Sign in with Google</span>
                                                    </button>
                                                </div>
                                            )}

                                            <div className="p-3 bg-cyber-dark/40 rounded-xl border border-cyber-border/60 text-[11px] text-gray-400 space-y-1">
                                                <p className="font-medium text-gray-300">Deploying Firebase Auth in Production?</p>
                                                <p>To enable standard Google popups on custom domains, add your domain to <strong>Firebase Console &gt; Authentication &gt; Settings &gt; Authorized Domains</strong>.</p>
                                            </div>
                                        </div>

                                        <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-5">
                                            <div>
                                                <label className="text-xs font-semibold text-gray-300 block mb-1">Prebuilt Voice Engine</label>
                                                <select
                                                    value={selectedVoice}
                                                    onChange={(e) => setSelectedVoice(e.target.value)}
                                                    className="w-full bg-cyber-dark border border-cyber-border rounded-xl p-3 text-sm text-white focus:outline-none focus:border-kaden-500"
                                                >
                                                    {VOICE_LIST.map(v => (
                                                        <option key={v} value={v}>{v}</option>
                                                    ))}
                                                </select>
                                                <p className="text-[11px] text-gray-500 mt-1">Select voice timbre for real-time speech responses.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
